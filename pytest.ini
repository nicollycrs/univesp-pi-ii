[pytest]
DJANGO_SETTINGS_MODULE = educaalerta.settings
python_files = test_*.py
testpaths = tests
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning:django_filters.*
    # STATIC_ROOT so existe depois do collectstatic; em teste o aviso e ruido.
    ignore:No directory at:UserWarning
    # O scikit-learn avisa sobre delayed/Parallel ao treinar a floresta com
    # n_jobs=-1. E ruido interno da biblioteca, nao do projeto.
    ignore:`sklearn.utils.parallel.delayed` should be used with:UserWarning
